[project]
name = "adesc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
# Base: everything the API and the gemini-queue worker need. Deliberately free
# of torch, OpenCV, faster-whisper, Kokoro and open_clip, so the slim image
# stays small — see docker/Dockerfile.slim. segmentation.py and
# transcription.py import their heavy dependencies lazily to keep that true.
dependencies = [
    "asyncpg>=0.31.0",
    "boto3>=1.43.69",
    "celery>=5.6.3",
    "cryptography>=49.0.0",
    "fastapi>=0.121.0",
    "google-genai>=1.9.0",
    "langgraph>=1.2.11",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "redis>=8.1.0",
    "soundfile>=0.12",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
# The media queue's stages: shot detection, VAD, transcription, TTS, and the
# CLIP retriever the Q&A tools use. ~4GB installed, hence its own image.
media = [
    "faster-whisper>=1.2.1",
    "kokoro>=0.9.4",
    "open-clip-torch>=3.3.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "scenedetect>=0.7",
    "silero-vad>=6.2.1",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.15.0",
    "torchvision>=0.28.0",
    "yt-dlp>=2026.1.26",
]

# The offline CMD-AD benchmark harness (bench/). Never imported by src/, and in
# neither Docker image — it runs on a developer's machine, against local files.
bench = [
    "bert-score>=0.3.13",
    "pyarrow>=18",
    "pycocoevalcap>=1.2",
    "yt-dlp>=2026.1.26",
]

# PyPI's torch wheels are the CUDA build: ~5GB of NVIDIA libraries that no
# machine here can use, and enough on its own to push the media image past
# Fly's 8GB uncompressed image limit, where it fails to unpack rather than
# merely deploying slowly. The linux marker scopes this to the Docker images —
# macOS wheels on PyPI are already CPU-only, so local dev is unaffected.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify code
]

ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# "src" for the flat-import convention; "." so the bench/ harness is importable.
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
