# The stateless HTTP/WebSocket API.
#
# Several machines, no volumes, no state: job state is in Supabase, live
# progress fans out over Redis, and media is served from R2 by presigned URL,
# so any machine can serve any request for any job.

app = "adesc-api"
primary_region = "iad"

[build]
  dockerfile = "../docker/Dockerfile.slim"
  build-target = "api"

[env]
  ADESC_LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  # Never scale to zero: a websocket client reconnecting into a cold start
  # would stall, and these machines are cheap.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
