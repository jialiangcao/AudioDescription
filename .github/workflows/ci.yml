name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # The repo tests run against a real Postgres rather than a mock; they
      # skip when one isn't configured, so CI must provide it or the whole
      # repo/task layer would silently go untested.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adesc
          POSTGRES_PASSWORD: adesc
          POSTGRES_DB: adesc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adesc -d adesc"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://adesc:adesc@localhost:5432/adesc
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      # ffmpeg builds the synthetic clips the pipeline tests run on; espeak-ng
      # is Kokoro's G2P fallback.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libsndfile1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen --extra media

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run pyright src

      - name: Test
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  images:
    # Proves both images build — in particular that the slim one can import
    # tasks.py without torch, OpenCV or faster-whisper, which is the whole
    # premise of splitting them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.slim
          target: api
          push: false
          cache-from: type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=slim
          load: true
          tags: adesc-slim:ci

      - name: The slim image must import the worker without the media deps
        run: |
          docker run --rm --entrypoint python adesc-slim:ci -c "
          import sys; sys.path.insert(0, '/app/src')
          import tasks, server, celery_app
          for banned in ('torch', 'cv2', 'faster_whisper', 'kokoro', 'open_clip'):
              assert banned not in sys.modules, f'{banned} was imported into the slim image'
          print('slim image imports cleanly')
          "

      # The media image is ~4GB of torch/OpenCV/faster-whisper before
      # warm_models.py bakes in another ~1.2GB of weights, which overruns the
      # ~14GB a stock ubuntu-latest runner has free — the build died with
      # "No space left on device" partway through downloading CLIP. None of
      # these toolchains are used by this job.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Build media image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.media
          push: false
          cache-from: type=gha,scope=media
          cache-to: type=gha,mode=max,scope=media
